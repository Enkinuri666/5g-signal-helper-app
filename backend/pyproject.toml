[project]
name = "signal-helper"
version = "0.1.0"
description = "Local-first 5G alignment tool for Vodafone AU Arcadyan FWA modems"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
signal-helper = "signal_helper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_helper"]

[tool.hatch.build.targets.wheel.force-include]
"src/signal_helper/static" = "signal_helper/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
