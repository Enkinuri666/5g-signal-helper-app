name: Build Enki Prompt Vault APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['enki_prompt_vault/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: enki_prompt_vault
        run: flutter pub get

      - name: Run tests
        working-directory: enki_prompt_vault
        run: flutter test

      - name: Clean Flutter artifacts
        working-directory: enki_prompt_vault
        run: flutter clean

      - name: Reinstall dependencies (fresh)
        working-directory: enki_prompt_vault
        run: flutter pub get

      - name: Build release APK
        working-directory: enki_prompt_vault
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: enki-prompt-vault-apk
          path: enki_prompt_vault/build/app/outputs/flutter-apk/app-release.apk
